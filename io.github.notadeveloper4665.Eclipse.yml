app-id: io.github.notadeveloper4665.Eclipse
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
command: moonlight-eclipse
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-videos:create
  - --talk-name=org.freedesktop.ScreenSaver
modules:
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Ddemos=false
      - -Dvulkan=enabled
      - -Dopengl=disabled
      - -Dshaderc=enabled
    sources:
      - type: git
        url: https://github.com/haasn/libplacebo.git
        commit: 4d82c6898551068d4ae6a6b5538efcddc2c7cf64
    cleanup:
      - /include
      - /lib/pkgconfig

  - name: SDL3
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL_ALSA=OFF
      - -DSDL_RPATH=OFF
      - -DSDL_KMSDRM=OFF
      - -DSDL_INSTALL_DOCS=OFF
      - -DSDL_TEST_LIBRARY=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        tag: release-3.4.14
        commit: 147a8ee32dbf9ac02f3794964490687b6bbda1bc

  - name: SDL2-compat
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2COMPAT_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/sdl2-compat.git
        tag: release-2.32.70
        commit: a53b6ad90ecd2d0ccfe01d5cfd2059793acf8c12

  - name: sdl2-pkgconfig-compat
    buildsystem: simple
    build-commands:
      - install -Dm0644 sdl2.pc /app/lib64/pkgconfig/sdl2.pc
    sources:
      - type: file
        path: packaging/flatpak/sdl2.pc

  - name: SDL2_ttf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2TTF_VENDORED=ON
      - -DSDL2TTF_SAMPLES=OFF
    sources:
      - type: git
        url: https://github.com/libsdl-org/SDL_ttf.git
        commit: a883e490e30fb44a5336ea3dcb990c6982c5216f

  - name: dav1d
    buildsystem: meson
    config-opts:
      - -Denable_tools=false
      - -Denable_tests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/dav1d.git
        tag: 1.5.4
        commit: 54706fc6bc0cdecab7e9593974a4039cc038fca7

  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --enable-pic
      - --enable-shared
      - --disable-static
      - --disable-debug
      - --disable-doc
      - --disable-programs
      - --disable-autodetect
      - --disable-everything
      - --enable-avcodec
      - --enable-avformat
      - --enable-swscale
      - --enable-decoder=h264,hevc,av1
      - --enable-parser=h264,hevc,av1
      - --enable-bsf=extract_extradata,h264_mp4toannexb,hevc_mp4toannexb
      - --enable-muxer=matroska
      - --enable-demuxer=matroska
      - --enable-protocol=file
      - --enable-libdav1d
      - --enable-vaapi
      - --enable-vdpau
      - --enable-vulkan
      - --enable-libdrm
      - --enable-hwaccel=h264_vaapi,hevc_vaapi,av1_vaapi
      - --enable-hwaccel=h264_vdpau,hevc_vdpau,av1_vdpau
      - --enable-hwaccel=h264_vulkan,hevc_vulkan,av1_vulkan
    sources:
      - type: git
        url: https://github.com/cgutman/FFmpeg.git
        commit: d17de7e33f1332cc2fb3f5afab9ed4f29699c5a0

  - name: eclipse
    buildsystem: simple
    build-commands:
      - unzip -q Eclipse-source.zip -d source
      - cp -a release-overlay/Eclipse/. source/Eclipse/
      - cd source/Eclipse && export PKG_CONFIG_PATH="/app/lib64/pkgconfig:/app/lib/pkgconfig:/app/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" && pkg-config --modversion SDL2_ttf && qmake moonlight-qt.pro CONFIG+=release CONFIG-=debug_and_release CONFIG+=disable-cuda QMAKE_RPATHDIR=/app/lib64
      - make -C source/Eclipse -j${FLATPAK_BUILDER_N_JOBS}
      - install -Dm0755 source/Eclipse/app/moonlight /app/bin/moonlight-eclipse
      - install -Dm0644 packaging/flatpak/io.github.notadeveloper4665.Eclipse.desktop /app/share/applications/io.github.notadeveloper4665.Eclipse.desktop
      - install -Dm0644 packaging/flatpak/io.github.notadeveloper4665.Eclipse.metainfo.xml /app/share/metainfo/io.github.notadeveloper4665.Eclipse.metainfo.xml
      - install -Dm0644 source/Eclipse/app/res/moonlight.svg /app/share/icons/hicolor/scalable/apps/io.github.notadeveloper4665.Eclipse.svg
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .flatpak-builder
          - build
          - build-controlcenter
          - build-passthrough
          - deliverables
          - '*.png'
