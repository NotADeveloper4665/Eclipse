name: Publish Eclipse development downloads
on:
  workflow_run:
    workflows: [Build Fedora RPM, Build and publish Flatpak, Source and interaction checks]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['.github/workflows/eclipse-dev-release.yml', 'scripts/publish-dev-release.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: eclipse-development-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish matching validated development builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-dev-release.py
