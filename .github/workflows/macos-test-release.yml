name: Eclipse macOS ARM64 build
on:
  pull_request:
    paths: ['release-overlay/**', 'scripts/*macos*', 'docs/macos-arm64-preview.md', '.github/workflows/macos-test-release.yml']
  push:
    branches: [main]
    paths: ['release-overlay/**', 'scripts/*macos*', 'docs/macos-arm64-preview.md', '.github/workflows/macos-test-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eclipse-macos-arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: Install native streaming dependencies
        run: brew install pkg-config ffmpeg sdl2 sdl2_ttf sdl3 opus openssl@3
      - name: Build native Eclipse ARM64 application and DMG
        env:
          ECLIPSE_VERSION: 0.5.10
        run: bash scripts/build-macos-test.sh
      - name: Record build provenance and checksums
        env:
          ARTEMIS_COMMIT: afe2de7f2b24a2f6161f5672e8aa38450fa793ef
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          root = pathlib.Path('macos-work/deliverables')
          (root/'build-info.json').write_text(json.dumps({
            'version': '0.5.10-macos-arm64-preview.1',
            'eclipse_commit': os.environ['GITHUB_SHA'],
            'artemis_reference': os.environ['ARTEMIS_COMMIT'],
            'architecture': 'arm64',
            'minimum_macos': '15.0',
            'signing': 'ad-hoc; not notarized',
            'test_suite': 'skipped by request',
            'dependencies': subprocess.check_output(['brew','list','--versions'], text=True),
            'hardware_streaming_tested': False
          }, indent=2)+'\\n')
          PYTHON
          cp docs/macos-arm64-preview.md macos-work/deliverables/README-macOS.md
          cd macos-work/deliverables
          shasum -a 256 *.dmg *.zip *.json *.md > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Eclipse-macOS-arm64-0.5.10
          path: macos-work/deliverables/*
          if-no-files-found: error
