name: Build Fedora RPM

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set package version
        run: |
          VERSION="$(sed -n 's/^Version:[[:space:]]*//p' packaging/eclipse.spec | head -n 1)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build RPM in Fedora 44
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            --env VERSION \
            fedora:44 /bin/bash -euxc '
              dnf install -y https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm
              dnf install -y rpm-build gcc gcc-c++ make unzip zip tar \
                qt5-qtbase-devel qt5-qtdeclarative-devel qt5-qtsvg-devel \
                qt5-qtquickcontrols2-devel openssl-devel SDL2-devel SDL2_ttf-devel \
                ffmpeg-devel libva-devel libvdpau-devel opus-devel \
                pulseaudio-libs-devel alsa-lib-devel libdrm-devel libplacebo-devel vulkan-loader-devel
              mkdir -p /work/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
              mkdir -p /tmp/eclipse-source
              unzip -q /work/Eclipse-source.zip -d /tmp/eclipse-source
              cp -a /work/release-overlay/Eclipse/. /tmp/eclipse-source/Eclipse/
              qmllint /tmp/eclipse-source/Eclipse/app/gui/SettingsView.qml
              cd /tmp/eclipse-source
              zip -qr "/work/Eclipse-source-${VERSION}.zip" Eclipse
              mv /tmp/eclipse-source/Eclipse "/tmp/eclipse-source/moonlight-eclipse-${VERSION}"
              tar -C /tmp/eclipse-source -czf "/work/rpmbuild/SOURCES/moonlight-eclipse-${VERSION}.tar.gz" "moonlight-eclipse-${VERSION}"
              cp /work/packaging/moonlight-eclipse.desktop /work/rpmbuild/SOURCES/
              rpmbuild -bb /work/packaging/eclipse.spec --define "_topdir /work/rpmbuild"
            '
          mkdir -p deliverables
          cp "Eclipse-source-${VERSION}.zip" "deliverables/Eclipse-source-${VERSION}.zip"

      - name: Save RPM and source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Eclipse-Fedora-44
          path: |
            rpmbuild/RPMS/x86_64/*.rpm
            deliverables/*.zip

      - name: Attach RPM and source to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" rpmbuild/RPMS/x86_64/*.rpm "deliverables/Eclipse-source-${VERSION}.zip" --repo "${GITHUB_REPOSITORY}"
