name: Source and interaction checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install development and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential unzip qtbase5-dev qtdeclarative5-dev libqt5svg5-dev qtquickcontrols2-5-dev \
            qml-module-qtquick2 qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtquick-window2 qml-module-qtgraphicaleffects \
            libssl-dev libsdl2-dev libsdl2-ttf-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libva-dev libvdpau-dev libopus-dev \
            libpulse-dev libasound2-dev libdrm-dev libegl1-mesa-dev libwayland-dev libplacebo-dev libvulkan-dev mesa-vulkan-drivers ffmpeg
      - name: Assemble complete source and parse QML
        run: |
          unzip -q Eclipse-source.zip -d source
          cp -a release-overlay/Eclipse/. source/Eclipse/
          qmllint source/Eclipse/app/gui/PcView.qml source/Eclipse/app/gui/SettingsView.qml source/Eclipse/app/gui/DeviceForwarding.qml source/Eclipse/app/gui/MediaForwarding.qml
          if grep -R -n -E '^\[.*truncat|^Warning: truncated output|^Total output lines:' --include='*.cpp' --include='*.h' --include='*.qml' source/Eclipse/app; then exit 1; fi
      - name: Syzygy passkey and transcript checks
        run: |
          g++ -std=c++17 -fPIC source/Eclipse/tests/syzygypairing_smoke.cpp -o syzygy-pairing-smoke $(pkg-config --cflags --libs Qt5Core)
          ./syzygy-pairing-smoke
      - name: Build the client
        run: |
          mkdir build
          cd build
          qmake ../source/Eclipse/moonlight-qt.pro CONFIG+=release CONFIG-=debug_and_release
          make -j2
      - name: Settings route and control runtime check
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          QML_DISABLE_DISK_CACHE: "1"
        run: |
          cd build/app
          qmake ../../source/Eclipse/app/app.pro CONFIG+=release CONFIG-=debug_and_release CONFIG+=eclipse-ui-test
          # qmake does not invalidate already-built objects when only a define changes.
          touch ../../source/Eclipse/app/main.cpp
          make -j2
          export XDG_CONFIG_HOME="$(mktemp -d)"
          timeout 60s ./moonlight > ui-test.log 2>&1
          cat ui-test.log
          grep -F 'Eclipse settings runtime test passed' ui-test.log
      - name: Control-center and forwarding lifecycle checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir build-controls build-forwarding
          cd build-controls
          qmake ../source/Eclipse/tests/controlcenter.pro
          make -j2
          ./controlcenter-test
          cd ../build-forwarding
          qmake ../source/Eclipse/tests/passthrough.pro
          make -j2
          ./passthrough-test
      - name: Encoded stream recording smoke test
        run: |
          mkdir build-recording
          cd build-recording
          qmake ../source/Eclipse/tests/recording.pro
          make -j2
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=30 -t 2 \
            -c:v libx264 -preset ultrafast -tune zerolatency -x264-params keyint=30 -f h264 video.h264
          ffmpeg -hide_banner -loglevel error -f lavfi -i sine=frequency=440:sample_rate=48000 -t 2 \
            -c:a libopus -b:a 96k -f ogg audio.ogg
          ./recording-smoke video.h264 audio.ogg recording-h264.mkv h264
          ffmpeg -hide_banner -loglevel error -i recording-h264.mkv -f framemd5 - > /dev/null
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=30 -t 2 \
            -c:v libx265 -preset ultrafast -x265-params pools=1:log-level=error:keyint=30 -f hevc video.hevc
          ./recording-smoke video.hevc audio.ogg recording-hevc.mkv hevc
          ffmpeg -hide_banner -loglevel error -i recording-hevc.mkv -f framemd5 - > /dev/null
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=320x240:rate=30 -t 2 \
            -c:v libaom-av1 -cpu-used 8 -crf 40 -b:v 0 -g 30 -f obu video.obu
          ./recording-smoke video.obu audio.ogg recording-av1.mkv av1
          ffmpeg -hide_banner -loglevel error -i recording-av1.mkv -f framemd5 - > /dev/null
          for codec in h264 hevc av1; do
            ffprobe -v error -show_entries stream=codec_name -of csv=p=0 "recording-${codec}.mkv" | sort | diff -u <(printf '%s\nopus\n' "$codec") -
          done
      - name: Actual FSR shader rendering and resize check
        run: |
          g++ -std=c++17 source/Eclipse/tests/fsr_smoke.cpp -o fsr-smoke $(pkg-config --cflags --libs libplacebo)
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          ./fsr-smoke source/Eclipse/app/res/fsr.glsl
      - name: Vulkan present mode selection and fallback check
        run: |
          g++ -std=c++17 source/Eclipse/tests/vkpresentmode_smoke.cpp -o vkpresentmode-smoke
          ./vkpresentmode-smoke
